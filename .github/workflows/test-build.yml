name: Test Build Pipeline

on:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Display Python version
        run: python --version
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-windows.txt
      
      - name: Verify build environment
        run: |
          # Check version file
          python -c "import sys; sys.path.insert(0, '.'); from core.version import APP_VERSION; print(f'App Version: {APP_VERSION}')"
          
          # Verify key dependencies are installed
          python -c "import torch; print(f'PyTorch: {torch.__version__}')"
          python -c "import onnxruntime; print(f'ONNX Runtime: {onnxruntime.__version__}')"
          python -c "import insightface; print('InsightFace: OK')"
      
      - name: Get app version
        id: version
        run: |
          $version = python -c "import sys; sys.path.insert(0, '.'); from core.version import APP_VERSION; print(APP_VERSION)"
          echo "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      
      - name: Create mock installer (for testing)
        run: |
          mkdir -p "dist\installers"
          # Create a test file (in real workflow, this would be the actual installer)
          echo "PhotoSearch-${{ steps.version.outputs.app_version }}-CPU" > "dist\installers\PhotoSearch-CPU.exe"
          echo "PhotoSearch-${{ steps.version.outputs.app_version }}-GPU" > "dist\installers\PhotoSearch-GPU.exe"
          echo "Files to upload:"
          dir "dist\installers"
      
      - name: Upload to Cloudflare R2
        if: success()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install boto3
          python -c "
import boto3
import os
from pathlib import Path

# Get version
version = r'${{ steps.version.outputs.app_version }}'
r2_url = f\"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com\"

print(f'Uploading installers for v{version} to R2...')
print(f'R2 URL: {r2_url}')
print(f'Bucket: {os.environ[\"R2_BUCKET_NAME\"]}')

# Initialize S3 client for R2
s3 = boto3.client(
    's3',
    endpoint_url=r2_url,
    aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
    aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
    region_name='auto'
)

# Upload files
installer_dir = Path('dist/installers')
if installer_dir.exists():
    for file in installer_dir.glob('*'):
        if file.is_file():
            r2_key = f'installers/v{version}/{file.name}'
            print(f'Uploading: {file.name} -> {r2_key}')
            with open(file, 'rb') as f:
                s3.upload_fileobj(f, os.environ['R2_BUCKET_NAME'], r2_key)
            print(f'✅ Uploaded: {r2_key}')
else:
    print('⚠️ No installers found in dist/installers')
"
      
      - name: Build status
        if: success()
        run: echo "✅ Build and R2 upload verified successfully"
