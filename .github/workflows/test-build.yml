name: Test Build Pipeline

on:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Display Python version
        run: python --version
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-windows.txt
      
      - name: Verify build environment
        run: |
          # Check version file
          python -c "import sys; sys.path.insert(0, '.'); from core.version import APP_VERSION; print(f'App Version: {APP_VERSION}')"
          
          # Verify key dependencies are installed
          python -c "import torch; print(f'PyTorch: {torch.__version__}')"
          python -c "import onnxruntime; print(f'ONNX Runtime: {onnxruntime.__version__}')"
          python -c "import insightface; print('InsightFace: OK')"
      
      - name: Get app version
        id: version
        run: |
          $version = python -c "import sys; sys.path.insert(0, '.'); from core.version import APP_VERSION; print(APP_VERSION)" | Out-String
          $version = $version.Trim()
          echo "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "Version extracted: $version"
      
      - name: Install Inno Setup
        run: |
          choco install innosetup -y
      
      - name: Build CPU Installer
        run: |
          cd packaging
          python build_windows.py CPU --iscc "C:\Program Files\Inno Setup 6\ISCC.exe"
      
      - name: Build GPU Installer
        run: |
          cd packaging
          python build_windows.py GPU --iscc "C:\Program Files\Inno Setup 6\ISCC.exe" 2>$null || Write-Host "GPU build skipped (CUDA dependencies may not be available)"
      
      - name: Verify installers
        run: |
          echo "Files to upload:"
          dir "dist\installers"
      
      - name: Upload to Cloudflare R2
        if: success()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          pip install boto3
          python .github/scripts/upload_to_r2.py
      
      - name: Build status
        if: success()
        run: echo "✅ Build and R2 upload verified successfully"
