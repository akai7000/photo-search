name: Test Build Pipeline

on:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Display Python version
        run: python --version
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-windows.txt
      
      - name: Verify build environment
        run: |
          # Check version file
          python -c "import sys; sys.path.insert(0, '.'); from core.version import APP_VERSION; print(f'App Version: {APP_VERSION}')"
          
          # Verify key dependencies are installed
          python -c "import torch; print(f'PyTorch: {torch.__version__}')"
          python -c "import onnxruntime; print(f'ONNX Runtime: {onnxruntime.__version__}')"
          python -c "import insightface; print('InsightFace: OK')"
      
      - name: Build status
        if: success()
        run: echo "✅ Build environment verified successfully"
